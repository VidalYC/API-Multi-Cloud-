services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: api-proveedores-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=api.main:app
      - FLASK_RUN_PORT=5000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Backend:/app
      - /app/venv
      - /app/vm_provisioning_api.egg-info
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api-proveedores-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  api-network:
    driver: bridge

volumes:
  backend-data:
